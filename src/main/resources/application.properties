# ============================================================
# NAP FILE .ENV NGUYEN BAN (SPRING BOOT NATIVE SUPPORT)
# ============================================================
spring.config.import=optional:file:.env[.properties]

# ============================================================
# CAU HINH DATABASE (Doc tu file .env)
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ============================================================
# LIQUIBASE DATABASE MIGRATION
# ============================================================
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# Hibernate chi kiem tra (validate) chu khong tu y can thiep schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# TASK 12 - VIETQR: Thong tin tai khoan ngan hang sinh ma QR (Doc tu .env)
# ============================================================
vietqr.bank-bin=${VIETQR_BANK_BIN}
vietqr.account-no=${VIETQR_ACCOUNT_NO}
vietqr.account-name=${VIETQR_ACCOUNT_NAME}
vietqr.template=${VIETQR_TEMPLATE:compact2}

# ============================================================
# TASK 7 - OTP qua Email: Thong tin Gmail SMTP (Doc tu .env)
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Base URL cua he thong (Doc tu .env)
app.base-url=${APP_BASE_URL:http://localhost:8080}
